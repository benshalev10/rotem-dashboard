<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotem Shani — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0a0c0f;
  --surface:   #111318;
  --surface2:  #181c23;
  --border:    #1f2430;
  --border2:   #2a3040;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --meta:      #4f9cf9;
  --google:    #34c27b;
  --urgent:    #f87171;
  --urgent-dim:#4c1111;
  --warn:      #fb923c;
  --warn-dim:  #4a1f07;
  --ok:        #4ade80;
  --ok-dim:    #0f3320;
  --accent:    #818cf8;
  --mono:      'IBM Plex Mono', monospace;
  --sans:      'Heebo', sans-serif;
  --chart-h:   220px;
  --pt:  #4f9cf9;
  --gb:  #34c27b;
  --eden:#fb923c;
  --ra:  #a78bfa;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; }

/* ── Login ── */
#login-screen { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:999; }
.login-box { background:var(--surface); border:1px solid var(--border2); border-radius:16px; padding:40px 32px; width:340px; text-align:center; }
.login-box h1 { font-size:1.4rem; font-weight:800; margin-bottom:4px; }
.login-box p  { color:var(--muted); font-size:.85rem; margin-bottom:24px; }
.login-box input { width:100%; padding:10px 14px; background:var(--surface2); border:1px solid var(--border2); border-radius:8px; color:var(--text); font-size:1rem; margin-bottom:12px; outline:none; }
.login-box input:focus { border-color:var(--accent); }
.login-box button { width:100%; padding:10px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
.login-err { color:var(--urgent); font-size:.82rem; margin-top:8px; display:none; }

/* ── Layout ── */
#app { display:none; }
header { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.logo { font-family:var(--mono); font-size:.85rem; letter-spacing:.1em; color:var(--accent); }
.gen-time { font-size:.75rem; color:var(--muted); }

/* ── Project Tabs ── */
.proj-tabs { display:flex; gap:8px; padding:16px 24px 0; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; }
.proj-tab { padding:10px 20px; border:none; border-radius:8px 8px 0 0; background:var(--surface2); color:var(--muted); font-family:var(--sans); font-size:.9rem; font-weight:600; cursor:pointer; transition:.2s; border-bottom:2px solid transparent; white-space:nowrap; }
.proj-tab:hover { color:var(--text); }
.proj-tab.active { color:#fff; border-bottom:2px solid currentColor; }
.proj-tab.tab-all    { color:#e2e8f0; }
.proj-tab.tab-pt     { color:var(--pt); }
.proj-tab.tab-gb     { color:var(--gb); }
.proj-tab.tab-eden   { color:var(--eden); }
.proj-tab.tab-ra     { color:var(--ra); }
.proj-tab.active.tab-all  { border-color:#e2e8f0; background:rgba(226,232,240,.08); }
.proj-tab.active.tab-pt   { border-color:var(--pt);   background:rgba(79,156,249,.1); }
.proj-tab.active.tab-gb   { border-color:var(--gb);   background:rgba(52,194,123,.1); }
.proj-tab.active.tab-eden { border-color:var(--eden); background:rgba(251,146,60,.1); }
.proj-tab.active.tab-ra   { border-color:var(--ra);   background:rgba(167,139,250,.1); }

/* ── Summary strip ── */
.summary-strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; padding:20px 24px; }
.sum-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
.sum-card .label { font-size:.75rem; color:var(--muted); margin-bottom:4px; }
.sum-card .val   { font-size:1.5rem; font-weight:800; }
.sum-card .sub   { font-size:.75rem; color:var(--muted); margin-top:2px; }

/* ── KPI row ── */
.kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; padding:0 24px 20px; }
.kpi { background:var(--surface); border-radius:10px; padding:14px; border-left:3px solid var(--border2); }
.kpi.meta   { border-color:var(--meta); }
.kpi.google { border-color:var(--google); }
.kpi-label  { font-size:.72rem; color:var(--muted); margin-bottom:4px; }
.kpi-val    { font-size:1.3rem; font-weight:800; }
.kpi-sub    { font-size:.72rem; color:var(--muted); margin-top:2px; }
.kpi-trend  { font-size:.72rem; margin-top:4px; }

/* ── Health banner ── */
.health-banner { margin:0 24px 16px; border-radius:10px; padding:14px 18px; display:flex; align-items:center; gap:14px; }
.health-banner.critical { background:var(--urgent-dim); border:1px solid var(--urgent); }
.health-banner.warning  { background:var(--warn-dim);   border:1px solid var(--warn); }
.health-banner.attention{ background:#1a2a1a;            border:1px solid #3a5a3a; }
.health-banner.healthy  { background:var(--ok-dim);     border:1px solid var(--ok); }
.health-icon { font-size:1.6rem; }
.health-text h3 { font-size:1rem; font-weight:700; margin-bottom:2px; }
.health-text p  { font-size:.8rem; color:var(--muted); }

/* ── Section title ── */
.section-title { display:flex; align-items:center; gap:10px; font-size:.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; padding:16px 24px 8px; }
.section-title::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── Action items ── */
.action-item { margin:4px 24px; border-radius:8px; padding:10px 14px; border:1px solid; }
.action-item.urgent  { background:var(--urgent-dim); border-color:#7f1d1d; }
.action-item.medium  { background:var(--warn-dim);   border-color:#78350f; }
.action-title  { font-size:.88rem; font-weight:600; margin-bottom:3px; }
.action-meta   { font-size:.78rem; color:var(--muted); }
.action-rec    { font-size:.78rem; color:var(--accent); margin-top:3px; }
.proj-badge    { display:inline-block; padding:1px 8px; border-radius:10px; font-size:.7rem; font-weight:700; margin-left:6px; }

/* ── Chart ── */
.chart-section { margin:0 24px 20px; }
.chart-controls { margin-bottom:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.chart-toggle { display:flex; gap:4px; }
.chart-toggle button { padding:4px 12px; background:var(--surface2); border:1px solid var(--border2); border-radius:6px; color:var(--muted); font-size:.78rem; cursor:pointer; transition:.15s; }
.chart-toggle button:hover { color:var(--text); }
.chart-toggle button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.camp-select { padding:4px 10px; background:var(--surface2); border:1px solid var(--border2); border-radius:6px; color:var(--text); font-size:.78rem; cursor:pointer; min-width:180px; max-width:320px; flex:1; }
.chart-wrap { background:var(--surface2); border:1px solid var(--border2); border-radius:10px; padding:16px 18px 10px; }
.chart-wrap canvas { max-height:var(--chart-h); }
.chart-legend { display:flex; gap:12px; margin-top:8px; flex-wrap:wrap; font-size:.75rem; color:var(--muted); }
.chart-legend span { display:flex; align-items:center; gap:5px; }
.chart-legend i { display:inline-block; width:12px; height:3px; border-radius:2px; }

/* ── Campaign table ── */
.camp-table-wrap { overflow-x:auto; margin:0 24px 20px; border-radius:10px; border:1px solid var(--border); }
table { width:100%; border-collapse:collapse; font-size:.8rem; }
thead tr { background:var(--surface2); }
th { padding:8px 10px; text-align:center; color:var(--muted); font-weight:600; border-bottom:1px solid var(--border); white-space:nowrap; }
th:first-child { text-align:right; }
td { padding:6px 10px; border-bottom:1px solid var(--border); text-align:center; }
td:first-child { text-align:right; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--surface2); }
.num { font-family:var(--mono); font-size:.78rem; }
.cpl-bad { color:var(--urgent); font-weight:700; }
.cpl-ok  { color:var(--ok); }
.tab-btns { display:flex; gap:4px; margin:0 24px 8px; }
.tab-btn  { padding:5px 14px; background:var(--surface2); border:1px solid var(--border2); border-radius:6px; color:var(--muted); font-size:.8rem; cursor:pointer; }
.tab-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

/* ── Trend pills ── */
.pill { display:inline-block; padding:1px 7px; border-radius:10px; font-size:.7rem; font-weight:700; }
.pill-up   { background:#4c1111; color:#f87171; }
.pill-down { background:#0f3320; color:#4ade80; }
.pill-neu  { background:#1e293b; color:#94a3b8; }

/* ── Project panel ── */
.proj-panel { display:none; }
.proj-panel.active { display:block; }

/* ── Accordion drill-down ── */
.acc-row { cursor:pointer; transition:background .15s; }
.acc-row:hover td { background:rgba(129,140,248,.06); }
.acc-row td:first-child .camp-name { color:var(--accent); text-decoration:underline dotted; cursor:pointer; }
.acc-row td .acc-arrow { display:inline-block; font-size:.7rem; margin-right:4px; transition:transform .2s; color:var(--muted); }
.acc-row.open td .acc-arrow { transform:rotate(90deg); }
.acc-content-row { display:none !important; }
.acc-content-row.open { display:table-row !important; }
.acc-content-cell { padding:0 !important; border-bottom:2px solid var(--accent) !important; }
.acc-inner { background:var(--surface2); padding:16px 20px; }
.acc-period-tabs { display:flex; gap:6px; margin-bottom:12px; }
.acc-period-btn { padding:4px 14px; background:var(--surface); border:1px solid var(--border2); border-radius:6px; color:var(--muted); font-size:.78rem; cursor:pointer; }
.acc-period-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.acc-kpi-row { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.acc-kpi { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 14px; min-width:100px; }
.acc-kpi .k-label { font-size:.68rem; color:var(--muted); margin-bottom:2px; }
.acc-kpi .k-val   { font-size:1.1rem; font-weight:800; }
.acc-chart-wrap { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 14px 8px; }
.acc-chart-wrap canvas { max-height:160px; }
.acc-mode-btns { display:flex; gap:4px; margin-bottom:8px; }
.acc-mode-btn { padding:3px 10px; background:var(--surface2); border:1px solid var(--border2); border-radius:5px; color:var(--muted); font-size:.72rem; cursor:pointer; }
.acc-mode-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.acc-sub-table { width:100%; border-collapse:collapse; margin-top:12px; font-size:.76rem; }
.acc-sub-table th { background:var(--surface); padding:5px 8px; color:var(--muted); font-weight:700; border-bottom:1px solid var(--border); text-align:center; }
.acc-sub-table th:first-child { text-align:right; }
.acc-sub-table td { padding:5px 8px; border-bottom:1px solid var(--border); text-align:center; }
.acc-sub-table td:first-child { text-align:right; }
.acc-sub-table tr:last-child td { border-bottom:none; }
.acc-sub-table tr:hover td { background:rgba(255,255,255,.03); }
.drill-badge { display:inline-block; padding:1px 7px; border-radius:8px; font-size:.68rem; font-weight:700; }
.badge-search { background:rgba(79,156,249,.2); color:#4f9cf9; }
.badge-pmax   { background:rgba(52,194,123,.2); color:#34c27b; }
.badge-paused { background:rgba(100,116,139,.2); color:#64748b; }
</style>
</head>
<body>

<!-- Login handled by /login page (server-side session) -->

<div id="app">
  <header>
    <span class="logo">ROTEM SHANI // DASHBOARD</span>
    <span class="gen-time" id="gen-time">—</span>
  </header>

  <!-- Project tabs -->
  <div class="proj-tabs" id="proj-tabs"></div>

  <!-- Summary strip -->
  <div class="summary-strip" id="summary-strip"></div>

  <!-- Project panels -->
  <div id="proj-panels"></div>
</div>

<script>
let DATA = null;

// Check session on load — redirect to /login if not authenticated
(async () => {
  const me = await fetch('/api/me').then(r=>r.json()).catch(()=>({loggedIn:false}));
  if (!me.loggedIn) { window.location.href = '/login'; return; }
  document.getElementById('app').style.display = 'block';
  // Show admin link if admin
  if (me.role === 'admin') {
    const hdr = document.querySelector('header');
    const a = document.createElement('a');
    a.href='/admin'; a.textContent='ניהול משתמשים';
    a.style.cssText='color:#818cf8;font-size:.8rem;text-decoration:none;margin-left:16px;';
    hdr.appendChild(a);
    const lo = document.createElement('a');
    lo.href='/logout'; lo.textContent='יציאה';
    lo.style.cssText='color:#64748b;font-size:.8rem;text-decoration:none;margin-left:8px;';
    hdr.appendChild(lo);
  } else {
    const hdr = document.querySelector('header');
    const lo = document.createElement('a');
    lo.href='/logout'; lo.textContent='יציאה';
    lo.style.cssText='color:#64748b;font-size:.8rem;text-decoration:none;';
    hdr.appendChild(lo);
  }
  loadData();
})();

async function loadData(){
  try {
    const resp = await fetch('/api/data?t='+Date.now());
    if (resp.status === 401) { window.location.href='/login'; return; }
    DATA = await resp.json();
    window._rsData = DATA;
    render();
  } catch(e) {
    document.getElementById('summary-strip').innerHTML =
      `<div style="color:var(--urgent);padding:20px">הנתונים טרם הועלו — הרץ את הסקריפט</div>`;
  }
}

// ── Formatters ──────────────────────────────────────
const fmt = {
  cpl:  v => v ? `₪${Number(v).toFixed(0)}` : '—',
  ils:  v => v ? `₪${Number(v).toFixed(0)}` : '—',
  pct:  v => v != null ? `${Number(v).toFixed(2)}%` : '—',
  num:  v => v != null ? Number(v).toFixed(0) : '—',
};

function trendPill(chg, invertGood=false){
  if(chg == null) return '';
  const pct = (chg*100).toFixed(0);
  const isGood = invertGood ? chg < 0 : chg > 0;
  if(Math.abs(chg) < 0.03) return `<span class="pill pill-neu">≈ יציב</span>`;
  return isGood
    ? `<span class="pill pill-up">${pct > 0 ? '+':''}${pct}%</span>`
    : `<span class="pill pill-down">${pct > 0 ? '+':''}${pct}%</span>`;
}

function trendPct(a, b){
  if(!a || !b || b===0) return null;
  return (a-b)/b;
}

function safeId(name){
  return (name||'').replace(/[^a-zA-Z0-9\u0590-\u05FF]/g,'_');
}

// ── Project config ───────────────────────────────────
const PROJ_CONFIG = {
  "ALL":             { cls:"tab-all",  color:"#e2e8f0", icon:"🏙️" },
  "פתח תקווה":      { cls:"tab-pt",   color:"#4f9cf9", icon:"🏙️" },
  "גבעתיים":        { cls:"tab-gb",   color:"#34c27b", icon:"🏙️" },
  "עדן / בית שמש":  { cls:"tab-eden", color:"#fb923c", icon:"🏙️" },
  "רעננה":          { cls:"tab-ra",   color:"#a78bfa", icon:"🏙️" },
};

function projConf(name){
  return PROJ_CONFIG[name] || { cls:"tab-all", color:"#e2e8f0", icon:"🏙️" };
}

function healthConf(h){
  return {
    critical:  { cls:"critical",  icon:"🚨", title:"דורש טיפול מיידי", sub:"בעיות קריטיות" },
    warning:   { cls:"warning",   icon:"⚠️", title:"נדרשת תשומת לב",   sub:"בעיות שזוהו" },
    attention: { cls:"attention", icon:"👀", title:"מצב סביר",          sub:"כמה הערות" },
    healthy:   { cls:"healthy",   icon:"✅", title:"מצב תקין",          sub:"הכל בסדר" },
  }[h] || { cls:"healthy", icon:"✅", title:"תקין", sub:"" };
}

// ── Render ───────────────────────────────────────────
function render(){
  document.getElementById('gen-time').textContent = DATA.generated_at || '';

  const projects = DATA.projects || [];
  const ORDER    = ["פתח תקווה","גבעתיים","עדן / בית שמש","רעננה"];

  // Build tabs
  const tabsEl = document.getElementById('proj-tabs');
  tabsEl.innerHTML = '';

  // ALL tab
  const allTab = document.createElement('button');
  allTab.className = 'proj-tab tab-all active';
  allTab.textContent = '🏙️ כל הפרויקטים';
  allTab.onclick = () => showProject('ALL');
  allTab.id = 'tab-ALL';
  tabsEl.appendChild(allTab);

  for(const p of projects){
    const pc  = projConf(p.project);
    const btn = document.createElement('button');
    btn.className = `proj-tab ${pc.cls}`;
    btn.id = 'tab-' + safeId(p.project);
    const urg = p.urgent_count > 0 ? ` <span style="background:var(--urgent);color:#fff;border-radius:10px;padding:1px 7px;font-size:.7rem">${p.urgent_count}</span>` : '';
    btn.innerHTML = `${pc.icon} ${p.project}${urg}`;
    btn.onclick = () => showProject(p.project);
    tabsEl.appendChild(btn);
  }

  // Summary strip (ALL)
  renderSummaryStrip(projects);

  // Build project panels
  const panelsEl = document.getElementById('proj-panels');
  panelsEl.innerHTML = '';

  // ALL panel
  const allPanel = document.createElement('div');
  allPanel.id = 'panel-ALL';
  allPanel.className = 'proj-panel active';
  allPanel.innerHTML = renderAllPanel(projects);
  panelsEl.appendChild(allPanel);

  // Per-project panels
  for(const p of projects){
    const div = document.createElement('div');
    div.id = 'panel-' + safeId(p.project);
    div.className = 'proj-panel';
    div.innerHTML = renderProjectPanel(p);
    panelsEl.appendChild(div);
  }

  setTimeout(() => initCharts(projects), 50);
}

function renderSummaryStrip(projects){
  const m7  = projects.reduce((a,p) => a + (p.meta_7d?.leads||0),    0);
  const g7  = projects.reduce((a,p) => a + (p.google_7d?.leads||0),  0);
  const ms7 = projects.reduce((a,p) => a + (p.meta_7d?.spend||0),    0);
  const gs7 = projects.reduce((a,p) => a + (p.google_7d?.spend||0),  0);
  const tot_leads = m7 + g7;
  const tot_spend = ms7 + gs7;
  const tot_cpl   = tot_leads > 0 ? tot_spend/tot_leads : null;
  const urg = projects.reduce((a,p) => a + p.urgent_count, 0);

  document.getElementById('summary-strip').innerHTML = `
    <div class="sum-card">
      <div class="label">סה"כ לידים 7d</div>
      <div class="val" style="color:var(--ok)">${fmt.num(tot_leads)}</div>
      <div class="sub">Meta ${fmt.num(m7)} · Google ${fmt.num(g7)}</div>
    </div>
    <div class="sum-card">
      <div class="label">CPL ממוצע 7d</div>
      <div class="val">${fmt.cpl(tot_cpl)}</div>
      <div class="sub">הוצאה: ${fmt.ils(tot_spend)}</div>
    </div>
    <div class="sum-card">
      <div class="label">הוצאה Meta 7d</div>
      <div class="val" style="color:var(--meta)">${fmt.ils(ms7)}</div>
    </div>
    <div class="sum-card">
      <div class="label">הוצאה Google 7d</div>
      <div class="val" style="color:var(--google)">${fmt.ils(gs7)}</div>
    </div>
    <div class="sum-card">
      <div class="label">Urgent Issues</div>
      <div class="val" style="color:${urg>0?'var(--urgent)':'var(--ok)'}">${urg}</div>
      <div class="sub">${projects.reduce((a,p)=>a+p.medium_count,0)} Medium</div>
    </div>
  `;
}

function renderAllPanel(projects){
  const ORDER = ["פתח תקווה","גבעתיים","עדן / בית שמש","רעננה"];
  let html = '';

  // Combined daily chart
  html += `
    <div class="section-title">📈 CPL יומי — כל הפרויקטים</div>
    <div class="chart-section">
      <div class="chart-controls">
        <div class="chart-toggle" id="all-mode-btns">
          <button class="active" onclick="switchAllMode('cpl',this)">CPL</button>
          <button onclick="switchAllMode('leads',this)">לידים</button>
          <button onclick="switchAllMode('spend',this)">הוצאה</button>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="chart-ALL" height="220"></canvas>
        <div class="chart-legend">
          ${ORDER.map(p=>{
            const pc = PROJ_CONFIG[p]||{};
            return `<span><i style="background:${pc.color}"></i>${p}</span>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;

  // Project cards grid
  html += `<div class="section-title">📊 פרויקטים</div>`;
  html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:0 24px 20px">`;
  for(const proj of ORDER){
    const p  = projects.find(x=>x.project===proj);
    if(!p) continue;

    html += `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;
                  padding:16px;border-top:3px solid ${pc.color};cursor:pointer"
           onclick="showProject('${proj}')">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="font-weight:700;font-size:.95rem;color:${pc.color}">${proj}</span>
          <span style="font-size:1.1rem">${hc.icon}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">

            <div style="font-size:.7rem;color:var(--muted)">Meta לידים 7d</div>

            <div style="font-size:1.1rem;font-weight:700;color:var(--google)">${fmt.num(g7.leads)}</div>
            <div style="font-size:.7rem;color:var(--muted)">CPL ${fmt.cpl(g7.cpl)}</div>

        </div>
        ${p.urgent_count > 0 ? `<div style="margin-top:8px;font-size:.75rem;color:var(--urgent)">🚨 ${p.urgent_count} Urgent</div>` : ''}
      </div>
    `;
  }
  html += '</div>';

  // All action items grouped by project
  const allActions = projects.flatMap(p => p.action_items||[]);
  if(allActions.length){
    html += `<div class="section-title">📋 כל ה-Action Items</div>`;
    for(const proj of ORDER){
      const pActions = allActions.filter(a=>a.project===proj);
      if(!pActions.length) continue;
      const pc = projConf(proj);
      html += `<div style="margin:4px 24px 2px;font-size:.8rem;font-weight:700;color:${pc.color}">${proj}</div>`;

          ${a.details ? `<div class="action-meta">${a.details}</div>`:''}
          <div class="action-rec">→ ${a.action}</div>
        </div>
      `).join('');
    }
  }

  return html;
}

// acc charts registry
const accCharts = {};

function buildCampTable(camps, periods, avgCpl, proj, platform){
  if(!camps || Object.keys(camps).length === 0)
    return '<div style="padding:20px;color:var(--muted);text-align:center">אין נתונים</div>';

  const sorted = Object.entries(camps)
    .sort((a,b) => (b[1][periods[2]]?.spend||0) - (a[1][periods[2]]?.spend||0));

  const colCount = 1 + periods.length * 3;
  let html = `<table><thead><tr>
    <th>קמפיין</th>
    ${periods.map(p=>`<th colspan="3">${p}</th>`).join('')}
  </tr><tr>
    <th></th>
    ${periods.map(()=>'<th>לידים</th><th>CPL</th><th>CTR%</th>').join('')}
  </tr></thead><tbody>`;

  for(const [name, pdata] of sorted){
    const cpl7 = pdata["7 ימים"]?.cpl;
    const plt  = platform || 'meta';
    const rowId = 'acc-' + safeId(proj||'') + '-' + plt[0] + '-' + safeId(name);
    const en = name.replace(/`/g,"'");
    const ep = (proj||'').replace(/`/g,"'");

    html += `<tr class="acc-row" id="${rowId}-row" onclick="toggleAcc('${rowId}','${ep}','${en}','${plt}')">
      <td><span class="acc-arrow">▶</span><span class="camp-name">${name}</span></td>`;

    for(const period of periods){
      const d = pdata[period] || {};
      let cplClass = '';
      if(d.cpl && cpl7){
        if(d.cpl > cpl7*1.25)      cplClass = 'cpl-bad';
        else if(d.cpl < cpl7*0.85) cplClass = 'cpl-ok';
      }
      html += `
        <td class="num">${d.leads != null ? fmt.num(d.leads) : '—'}</td>
        <td class="num ${cplClass}">${fmt.cpl(d.cpl)}</td>
        <td class="num">${fmt.pct(d.ctr)}</td>`;
    }
    html += `</tr>
    <tr class="acc-content-row" id="${rowId}-content">
      <td class="acc-content-cell" colspan="${colCount}">
        <div class="acc-inner" id="${rowId}-inner">טוען...</div>
      </td>
    </tr>`;
  }
  html += '</tbody></table>';
  return html;
}

function toggleAcc(rowId, proj, campName, platform){
  const row     = document.getElementById(rowId+'-row');
  const content = document.getElementById(rowId+'-content');
  if(!row || !content){ console.warn('toggleAcc missing:', rowId); return; }

  const isOpen = row.classList.contains('open');

  const table = row.closest('table');
  (table||document).querySelectorAll('.acc-row.open').forEach(r=>{
    r.classList.remove('open');
    const rid = r.id.replace('-row','');
    const ct  = document.getElementById(rid+'-content');
    if(ct) ct.classList.remove('open');
  });

  if(isOpen) return;

  row.classList.add('open');
  content.classList.add('open');
  // וודא שה-camp-table-wrap ההורה גלוי
  const wrap = row.closest('.camp-table-wrap');
  if(wrap && wrap.style.display === 'none') wrap.style.display = '';
  buildAccContent(rowId, proj, campName, platform);
}

// ── Accordion level 2: Ad Sets / Ad Groups ─────────
function buildAccContent(rowId, proj, campName, platform){
  const p = (DATA.projects||[]).find(x=>x.project===proj);
  if(!p) return;
  const inner = document.getElementById(rowId+'-inner');
  if(!inner) return;

  window._accData = window._accData||{};

  if(platform==='meta'){
    const adsets = (p.meta_adsets_by_campaign||{})[campName] || [];
    if(!adsets.length){
      inner.innerHTML = '<div style="color:var(--muted);padding:16px;text-align:center">אין נתוני Ad Sets — הרץ סקריפט מחדש</div>';
      return;
    }
    inner.innerHTML = buildAdsetsList(adsets, rowId, proj, campName);
  } else {
    const groups = (p.google_adgroups_by_campaign||{})[campName] || [];
    if(!groups.length){
      inner.innerHTML = '<div style="color:var(--muted);padding:16px;text-align:center">אין נתוני Ad Groups — הרץ סקריפט מחדש</div>';
      return;
    }
    inner.innerHTML = buildGoogleGroupsList(groups, rowId);
    // גרף לכל group
    setTimeout(()=>{
      groups.forEach((g,i)=>{
        const gid = rowId+'-g'+i;
        window._accData[gid] = {daily:[], platform:'google'};
        // Google אין daily per adgroup כרגע — הצג placeholder
      });
    },30);
  }
}

function buildAdsetsList(adsets, campRowId, proj, campName){
  const PERIODS = ["אתמול","3 ימים","7 ימים"];
  let html = `<div style="font-size:.75rem;color:var(--muted);margin-bottom:10px;padding:2px 0 8px;border-bottom:1px solid var(--border)">
    👥 <strong style="color:var(--text)">${adsets.length} Ad Sets</strong> — לחץ על שם לפירוט ומגמה
  </div>`;

  for(let i=0; i<adsets.length; i++){
    const a    = adsets[i];
    const asId = campRowId+'-as'+i;
    const d7   = a.by_period?.["7 ימים"] || {};
    const cplC = d7.cpl&&d7.cpl>200?'var(--urgent)':d7.cpl&&d7.cpl<80?'var(--ok)':'var(--text)';

              <div style="color:${d.cpl&&d.cpl>200?'var(--urgent)':d.cpl&&d.cpl<80?'var(--ok)':'var(--muted)'};font-size:.66rem">${fmt.cpl(d.cpl)}</div>
              <div style="color:${d.ctr&&d.ctr<0.5?'var(--urgent)':'var(--muted)'};font-size:.58rem">${fmt.pct(d.ctr)}</div>
            </div>`;
          }).join('')}

            <div style="color:var(--muted);font-size:.58rem;margin-bottom:1px">Freq</div>

function toggleAdset(asId, proj, campName, adsetName){
  const row     = document.getElementById(asId+'-row');
  const content = document.getElementById(asId+'-content');
  if(!row||!content) return;
  const isOpen = row.classList.contains('open');

  // סגור אחרים באותה רמה
  const parent = row.closest('.acc-inner')||row.parentElement.parentElement;
  parent.querySelectorAll('.acc-row.open').forEach(r=>{
    r.classList.remove('open');
    const rid = r.id.replace('-row','');
    const ct  = document.getElementById(rid+'-content');
    if(ct) ct.style.display='none';
  });

  if(isOpen) return;
  row.classList.add('open');
  content.style.display='block';
  buildAdsetContent(asId, proj, campName, adsetName);
}

function buildAdsetContent(asId, proj, campName, adsetName){
  const inner = document.getElementById(asId+'-inner');
  if(!inner) return;
  const p = (DATA.projects||[]).find(x=>x.project===proj);
  if(!p) return;
  const adsets = (p.meta_adsets_by_campaign||{})[campName]||[];
  const adset  = adsets.find(a=>a.adset_name===adsetName);
  if(!adset){ inner.innerHTML='<div style="color:var(--muted)">לא נמצא</div>'; return; }

  const daily = adset.daily||[];
  const ads   = adset.ads||[];

  // גרף
  const chartHtml = daily.length>1 ? `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">📈 מגמה יומית — 14d</span>
      <div class="acc-mode-btns" id="${asId}-mode">
        <button class="acc-mode-btn active" onclick="switchAccMode('${asId}','cpl',this)">CPL</button>
        <button class="acc-mode-btn" onclick="switchAccMode('${asId}','ctr',this)">CTR%</button>
        <button class="acc-mode-btn" onclick="switchAccMode('${asId}','leads',this)">לידים</button>
      </div>
    </div>
    <div class="acc-chart-wrap" style="margin-bottom:14px">
      <canvas id="${asId}-chart"></canvas>
    </div>` : '';

  // מודעות
  let adsHtml = '';
  if(ads.length){
    adsHtml = `<div style="font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">🖼️ מודעות (${ads.length})</div>
    <table class="acc-sub-table"><thead><tr>
      <th>מודעה</th><th>הוצאה</th><th>לידים</th><th>CPL</th><th>CTR%</th><th>Freq</th>
    </tr></thead><tbody>`;
    for(const ad of ads){
      const cplC = ad.cpl&&ad.cpl>200?'color:var(--urgent)':ad.cpl&&ad.cpl<80?'color:var(--ok)':'';
      const ctrC = ad.ctr&&ad.ctr<0.5?'color:var(--urgent)':'';
      adsHtml += `<tr>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${ad.ad_name}">${ad.ad_name}</td>
        <td class="num">${fmt.ils(ad.spend)}</td>
        <td class="num">${fmt.num(ad.leads)}</td>
        <td class="num" style="${cplC}">${fmt.cpl(ad.cpl)}</td>
        <td class="num" style="${ctrC}">${fmt.pct(ad.ctr)}</td>
        <td class="num">${ad.frequency?Number(ad.frequency).toFixed(1):'—'}</td>
      </tr>`;
    }

  }

  inner.innerHTML = chartHtml + adsHtml ||
    '<div style="color:var(--muted);font-size:.8rem">אין נתוני מודעות</div>';

  window._accData = window._accData||{};
  window._accData[asId] = {daily, platform:'meta'};
  if(daily.length>1) setTimeout(()=>buildAccChart(asId, daily, 'cpl', 'meta'), 30);
}

function buildGoogleGroupsList(groups, rowId){
  const searches = groups.filter(g=>g.type==='ad_group');
  const pmaxes   = groups.filter(g=>g.type==='asset_group');
  let html = '';
  const buildSection = (rows, title, hasCtr) => {
    if(!rows.length) return '';
    let h = `<div style="font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px">${title}</div>
    <table class="acc-sub-table"><thead><tr>
      <th>שם</th><th>הוצאה</th><th>לידים</th><th>CPL</th>
      ${hasCtr?'<th>CTR%</th>':'<th>חשיפות</th>'}
      <th>סטטוס</th>
    </tr></thead><tbody>`;
    for(const g of rows){
      const cplC = g.cpl&&g.cpl>200?'color:var(--urgent)':g.cpl&&g.cpl<80?'color:var(--ok)':'';
      const badge = g.status==='ENABLED'
        ?`<span class="drill-badge ${hasCtr?'badge-search':'badge-pmax'}">פעיל</span>`
        :`<span class="drill-badge badge-paused">מושהה</span>`;
      const lastCol = hasCtr
        ?`<td class="num" style="${g.ctr&&g.ctr<0.5?'color:var(--urgent)':''}">${fmt.pct(g.ctr)}</td>`
        :`<td class="num">${g.impressions?Number(g.impressions).toLocaleString():'—'}</td>`;
      h+=`<tr>
        <td>${g.name}</td>
        <td class="num">${fmt.ils(g.spend)}</td>
        <td class="num">${fmt.num(g.leads)}</td>
        <td class="num" style="${cplC}">${fmt.cpl(g.cpl)}</td>
        ${lastCol}<td>${badge}</td>
      </tr>`;
    }
    return h+'</tbody></table>';
  };
  html += buildSection(searches,'🔍 Ad Groups — Search',true);
  html += buildSection(pmaxes,'⚡ Asset Groups — PMAX',false);
  return html;
}

function buildAccChart(rowId, daily, mode, platform){
  const canvas = document.getElementById(rowId+'-chart');
  if(!canvas) return;
  if(accCharts[rowId]){ accCharts[rowId].destroy(); delete accCharts[rowId]; }
  const color = platform==='google'?'#34c27b':'#4f9cf9';
  const bg    = platform==='google'?'rgba(52,194,123,.15)':'rgba(79,156,249,.12)';
  const key   = mode==='cpl'?'cpl':mode==='ctr'?'ctr':'leads';
  const isCPL = mode==='cpl', isCTR = mode==='ctr';
  accCharts[rowId] = new Chart(canvas,{
    type: mode==='leads'?'bar':'line',
    data:{
      labels: daily.map(d=>fmtDate(d.date)),
      datasets:[{
        data: daily.map(d=>d[key]??null),
        borderColor:color, backgroundColor:mode==='leads'?color+'99':bg,
        borderWidth:2, tension:.35, fill:mode!=='leads', pointRadius:3, spanGaps:true,
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:true,
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'rgba(17,19,24,.95)',borderColor:'#2a3040',borderWidth:1,
        titleColor:'#94a3b8',bodyColor:'#e2e8f0',padding:8,rtl:true,
        callbacks:{label:ctx=>{
          const v=ctx.parsed.y;
          return isCPL?` ₪${v!=null?v.toFixed(0):'—'}`:isCTR?` ${v!=null?v.toFixed(2):'—'}%`:` ${v!=null?v.toFixed(0):'—'}`;
        }}
      }},
      scales:{
        x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#64748b',font:{size:9}}},
        y:{grid:{color:'rgba(255,255,255,.06)'},beginAtZero:!isCPL,
           ticks:{color:'#64748b',font:{size:9},callback:v=>isCPL?'₪'+v:isCTR?v+'%':v}}
      }
    }
  });
}

function switchAccMode(rowId, mode, btn){
  document.querySelectorAll('#'+rowId+'-mode .acc-mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

// ── Charts ───────────────────────────────────────────
const activeCharts = {};
const chartState   = {};

function destroyChart(id){
  if(activeCharts[id]){ activeCharts[id].destroy(); delete activeCharts[id]; }
}

function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'});
}
function mkLine(label,data,color,bg,fill,dashed){
  return {label,data,borderColor:color,backgroundColor:bg,borderWidth:2,
    tension:.35,fill:!!fill,pointRadius:3,pointHoverRadius:5,spanGaps:true,
    ...(dashed?{borderDash:[5,3]}:{})};
}
function mkBar(label,data,color,bg){
  return {label,data,borderColor:color,backgroundColor:bg,borderWidth:1.5,type:'bar'};
}

function chartOpts(mode){
  const isCPL = mode==='cpl', isCTR = mode==='ctr';
  return {
    responsive:true, maintainAspectRatio:true,
    interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{display:false},
      tooltip:{
        backgroundColor:'rgba(17,19,24,.95)',borderColor:'#2a3040',borderWidth:1,
        titleColor:'#94a3b8',bodyColor:'#e2e8f0',padding:10,rtl:true,
        callbacks:{
          label: ctx => {
            const v=ctx.parsed.y; if(v==null) return '';
            if(isCPL) return ` ${ctx.dataset.label}: ₪${v.toFixed(0)}`;
            if(isCTR) return ` ${ctx.dataset.label}: ${v.toFixed(2)}%`;
            return ` ${ctx.dataset.label}: ${v.toFixed(0)}`;
          }
        }
      }
    },
    scales:{
      x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#64748b',font:{size:10}}},
      y:{grid:{color:'rgba(255,255,255,.06)'},beginAtZero:mode==='leads'||isCTR,
         ticks:{color:'#64748b',font:{size:10},
                callback: v=>isCPL?'₪'+v:isCTR?v+'%':v}}
    }
  };
}

// ALL combined chart (all projects by project daily)
function buildAllChart(mode){
  destroyChart('chart-ALL');
  const canvas = document.getElementById('chart-ALL');
  if(!canvas || !DATA) return;

  const ORDER  = ["פתח תקווה","גבעתיים","עדן / בית שמש","רעננה"];
  const COLORS = {"פתח תקווה":"#4f9cf9","גבעתיים":"#34c27b","עדן / בית שמש":"#fb923c","רעננה":"#a78bfa"};
  const isCPL  = mode==='cpl', isSpend = mode==='spend';

  // collect all dates
  const allDates = [...new Set(
    (DATA.projects||[]).flatMap(p => (p.daily||[]).map(d=>d.date))
  )].sort();

  if(!allDates.length) return;

  const datasets = [];
  for(const proj of ORDER){
    const p = (DATA.projects||[]).find(x=>x.project===proj);
    if(!p?.daily?.length) continue;
    const byDate = {};
    for(const d of p.daily) byDate[d.date] = d;
    const key = isCPL ? 'cpl' : isSpend ? 'spend' : 'leads';
    const data = allDates.map(dt => byDate[dt]?.[key] ?? null);
    datasets.push(mkLine(proj, data, COLORS[proj], COLORS[proj]+'22', false));
  }

  if(!datasets.length) return;
  activeCharts['chart-ALL'] = new Chart(canvas, {
    type: 'line',
    data: { labels: allDates.map(fmtDate), datasets },
    options: chartOpts(mode),
  });
}

function switchAllMode(mode, btn){
  document.querySelectorAll('#all-mode-btns button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildAllChart(mode);
}

// Per-project chart
function buildProjChart(cn, p, mode, platform, campaign){
  destroyChart('chart-'+cn);
  const canvas = document.getElementById('chart-'+cn);
  if(!canvas) return;

  const st = chartState[cn] || (chartState[cn]={platform:'all',campaign:'ALL',mode:'cpl'});
  if(mode)     st.mode     = mode;
  if(platform) st.platform = platform;
  if(campaign) st.campaign = campaign;
  mode = st.mode; platform = st.platform; campaign = st.campaign;

  const isCPL = mode==='cpl', isCTR = mode==='ctr', isBar = mode==='leads';
  const metaBycamp   = p.meta_daily_by_campaign   || {};
  const googleBycamp = p.google_daily_by_campaign || {};
  const projDaily    = p.daily || [];

  const datasets = [];
  let labels = [];

  function fromDays(days, label, color, bg){
    if(!days?.length) return;
    if(!labels.length) labels = days.map(d=>fmtDate(d.date));
    const key = isCPL?'cpl':isCTR?'ctr':'leads';
    if(isBar) datasets.push(mkBar(label, days.map(d=>d[key]||0), color, bg));
    else      datasets.push(mkLine(label, days.map(d=>d[key]??null), color, bg, datasets.length===0));
  }

  // aggregate כל הקמפיינים לפלטפורמה אחת
  function aggregateDays(byCamp){
    const byDate = {};
    for(const days of Object.values(byCamp)){
      for(const d of days){
        if(!byDate[d.date]) byDate[d.date]={spend:0,leads:0,ctr_sum:0,ctr_cnt:0};
        byDate[d.date].spend += d.spend||0;
        byDate[d.date].leads += Math.round(d.leads||0);
        if(d.ctr){ byDate[d.date].ctr_sum += d.ctr; byDate[d.date].ctr_cnt++; }
      }
    }
    return Object.entries(byDate).sort(([a],[b])=>a<b?-1:1).map(([dt,v])=>({
      date:dt, spend:v.spend, leads:v.leads,
      cpl: v.leads>0 ? v.spend/v.leads : null,
      ctr: v.ctr_cnt>0 ? v.ctr_sum/v.ctr_cnt : null,
    }));
  }

  // בנה dataset בודד על ציר תאריכים נתון
  function buildSeries(days, allDates, key){
    const byDate = {};
    for(const d of days) byDate[d.date]=d;
    return allDates.map(dt=>{
      const v = byDate[dt]?.[key];
      return (v != null && !isNaN(v)) ? v : null;
    });
  }

  if(campaign === 'ALL'){
    const mdays = Object.keys(metaBycamp).length>0 ? aggregateDays(metaBycamp) : projDaily;
    const gdays = aggregateDays(googleBycamp);

    const showMeta   = (platform==='all' || platform==='meta')   && mdays.length>0;
    const showGoogle = (platform==='all' || platform==='google') && gdays.length>0 && p.has_google;

    // union תאריכים
    const dateSet = new Set();
    if(showMeta)   mdays.forEach(d=>dateSet.add(d.date));
    if(showGoogle) gdays.forEach(d=>dateSet.add(d.date));
    const allDates = [...dateSet].sort();
    if(!allDates.length) return;

    labels = allDates.map(fmtDate);
    const key = isCPL?'cpl':isCTR?'ctr':'leads';

    if(showMeta){
      const vals = buildSeries(mdays, allDates, key);
      if(isBar) datasets.push(mkBar('📘 Meta', vals.map(v=>v??0), '#4f9cf9','rgba(79,156,249,.5)'));
      else      datasets.push(mkLine('📘 Meta', vals, '#4f9cf9','rgba(79,156,249,.12)', !showGoogle));
    }
    if(showGoogle){
      const vals = buildSeries(gdays, allDates, key);
      if(isBar) datasets.push(mkBar('📗 Google', vals.map(v=>v??0), '#34c27b','rgba(52,194,123,.5)'));
      else      datasets.push(mkLine('📗 Google', vals, '#34c27b','rgba(52,194,123,.12)', !showMeta));
    }
  } else {
    // קמפיין ספציפי — מצא לפי platform
    const isGoogle = googleBycamp[campaign] !== undefined &&
                     (platform==='google' || (platform==='all' && !metaBycamp[campaign]));
    const src   = isGoogle ? googleBycamp : metaBycamp;
    const color = isGoogle ? '#34c27b' : '#4f9cf9';
    const bg    = isGoogle ? 'rgba(52,194,123,.15)' : 'rgba(79,156,249,.15)';
    const icon  = isGoogle ? '📗' : '📘';
    fromDays(src[campaign], icon+' '+campaign, color, bg);
  }

  if(!datasets.length || !labels.length) return;
  activeCharts['chart-'+cn] = new Chart(canvas, {
    type: isBar?'bar':'line',
    data: {labels, datasets},
    options: chartOpts(mode),
  });
}

  if(platform==='all'||platform==='google') camps = camps.concat(Object.keys(p.google_daily_by_campaign||{}));

  sel.innerHTML = '<option value="ALL">כל הקמפיינים</option>' +

  if(p) buildProjChart(cn, p, null, null, sel.value);
}

function switchProjMode(cn, mode, btn){
  document.querySelectorAll('#mode-btns-'+cn+' button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const p = (DATA.projects||[]).find(x=>safeId(x.project)===cn);
  if(p) buildProjChart(cn, p, mode, null, null);
}

function switchCampTab(cn, tab, btn){
  document.querySelectorAll(`#camp-tabs-${cn} .tab-btn`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['meta','google'].forEach(t=>{
    const el = document.getElementById(`ctab-${t}-${cn}`);
    if(el) el.style.display = t===tab?'block':'none';
  });
}

function toggleAiAdset(asId){
  const body  = document.getElementById(asId+'-body');
  const arrow = document.getElementById(asId+'-arrow');
  if(!body) return;
  const isOpen = body.style.display !== 'none';
  body.style.display  = isOpen ? 'none' : 'block';
  if(arrow) arrow.style.transform = isOpen ? '' : 'rotate(90deg)';
}

function toggleAiCamp(accId){
  const body  = document.getElementById(accId+'-body');
  const arrow = document.getElementById(accId+'-arrow');
  if(!body) return;
  const isOpen = body.style.display !== 'none';
  body.style.display  = isOpen ? 'none' : 'block';
  if(arrow) arrow.style.transform = isOpen ? '' : 'rotate(90deg)';
}

function switchAiTab(cn, tab, btn){
  document.querySelectorAll('#ai-tabs-'+cn+' .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('ai-meta-'+cn).style.display   = tab==='meta'   ? '' : 'none';
  document.getElementById('ai-google-'+cn).style.display = tab==='google' ? '' : 'none';
}

function initCharts(projects){
  buildAllChart('cpl');
  for(const p of projects){
    const cn = safeId(p.project);
    if(p.daily?.length > 1){
      updateProjDropdown(cn, 'all', p);
      buildProjChart(cn, p, 'cpl', 'all', 'ALL');
    }
  }
}
</script>
</body>
</html>
