<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול משתמשים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#0a0c0f; color:#e2e8f0; font-family:'Heebo',sans-serif; min-height:100vh; }
header { background:#111318; border-bottom:1px solid #1f2430; padding:14px 28px; display:flex; align-items:center; justify-content:space-between; }
.logo { color:#818cf8; font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; }
.nav a { color:#64748b; font-size:.85rem; text-decoration:none; margin-right:16px; }
.nav a:hover { color:#e2e8f0; }
main { max-width:700px; margin:40px auto; padding:0 20px; }
h2 { font-size:1.4rem; font-weight:800; margin-bottom:24px; }
.card { background:#111318; border:1px solid #1f2430; border-radius:12px; padding:24px; margin-bottom:24px; }
.card h3 { font-size:1rem; font-weight:600; margin-bottom:16px; color:#818cf8; }
.row { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
input, select {
  flex:1; min-width:120px; padding:9px 12px;
  background:#181c23; border:1px solid #2a3040; border-radius:8px;
  color:#e2e8f0; font-size:.9rem; font-family:'Heebo',sans-serif; outline:none;
}
input:focus, select:focus { border-color:#818cf8; }
button.primary {
  padding:9px 20px; background:#818cf8; border:none; border-radius:8px;
  color:#fff; font-size:.9rem; font-weight:600; font-family:'Heebo',sans-serif; cursor:pointer;
}
button.primary:hover { opacity:.88; }
button.danger {
  padding:6px 14px; background:transparent; border:1px solid #f87171; border-radius:6px;
  color:#f87171; font-size:.8rem; font-family:'Heebo',sans-serif; cursor:pointer;
}
button.danger:hover { background:#4c1111; }
button.ghost {
  padding:6px 14px; background:transparent; border:1px solid #2a3040; border-radius:6px;
  color:#64748b; font-size:.8rem; font-family:'Heebo',sans-serif; cursor:pointer;
}
button.ghost:hover { border-color:#818cf8; color:#818cf8; }
table { width:100%; border-collapse:collapse; }
th { text-align:right; padding:8px 10px; font-size:.78rem; color:#64748b; border-bottom:1px solid #1f2430; }
td { padding:10px; font-size:.88rem; border-bottom:1px solid #1a1f2a; vertical-align:middle; }
tr:last-child td { border-bottom:none; }
.badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:.75rem; font-weight:600; }
.badge.admin  { background:#312e81; color:#a5b4fc; }
.badge.viewer { background:#1e3a2f; color:#4ade80; }
.msg { font-size:.83rem; margin-top:8px; min-height:18px; }
.msg.ok  { color:#4ade80; }
.msg.err { color:#f87171; }
.pw-row { display:flex; gap:8px; align-items:center; }
.pw-row input { flex:1; }
</style>
</head>
<body>
<header>
  <div class="logo">Rotem Shani — Admin</div>
  <nav class="nav">
    <a href="/">← לוח הבקרה</a>
    <a href="/logout">יציאה</a>
  </nav>
</header>
<main>
  <h2>ניהול משתמשים</h2>

  <!-- Add user -->
  <div class="card">
    <h3>הוסף משתמש חדש</h3>
    <div class="row">
      <input id="new-user" type="text" placeholder="שם משתמש" />
      <input id="new-pass" type="password" placeholder="סיסמה (מינ׳ 6 תווים)" />
      <select id="new-role">
        <option value="viewer">צופה</option>
        <option value="admin">מנהל</option>
      </select>
      <button class="primary" onclick="addUser()">הוסף</button>
    </div>
    <div class="msg" id="add-msg"></div>
  </div>

  <!-- User list -->
  <div class="card">
    <h3>משתמשים קיימים</h3>
    <table>
      <thead><tr><th>שם משתמש</th><th>תפקיד</th><th>שינוי סיסמה</th><th>מחיקה</th></tr></thead>
      <tbody id="user-list"><tr><td colspan="4" style="color:#64748b;text-align:center">טוען...</td></tr></tbody>
    </table>
  </div>
</main>

<script>
async function loadUsers() {
  const res = await fetch('/api/users');
  const users = await res.json();
  const tbody = document.getElementById('user-list');
  if (!users.length) { tbody.innerHTML = '<tr><td colspan="4" style="color:#64748b;text-align:center">אין משתמשים</td></tr>'; return; }
  tbody.innerHTML = users.map(u => `
    <tr>
      <td><strong>${u.username}</strong></td>
      <td><span class="badge ${u.role}">${u.role === 'admin' ? 'מנהל' : 'צופה'}</span></td>
      <td>
        <div class="pw-row">
          <input type="password" id="pw-${u.username}" placeholder="סיסמה חדשה" />
          <button class="ghost" onclick="changePw('${u.username}')">עדכן</button>
        </div>
        <div class="msg" id="pw-msg-${u.username}"></div>
      </td>
      <td><button class="danger" onclick="deleteUser('${u.username}')">מחק</button></td>
    </tr>
  `).join('');
}

async function addUser() {
  const msg = document.getElementById('add-msg');
  const body = {
    username: document.getElementById('new-user').value.trim().toLowerCase(),
    password: document.getElementById('new-pass').value,
    role:     document.getElementById('new-role').value
  };
  const res = await fetch('/api/users', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await res.json();
  if (data.ok) {
    msg.className='msg ok'; msg.textContent='✓ משתמש נוסף בהצלחה';
    document.getElementById('new-user').value='';
    document.getElementById('new-pass').value='';
    loadUsers();
  } else {
    msg.className='msg err'; msg.textContent = data.error || 'שגיאה';
  }
}

async function deleteUser(username) {
  if (!confirm(`למחוק את ${username}?`)) return;
  const res = await fetch(`/api/users/${username}`, { method:'DELETE' });
  const data = await res.json();
  if (data.ok) loadUsers();
  else alert(data.error);
}

async function changePw(username) {
  const pw  = document.getElementById(`pw-${username}`).value;
  const msg = document.getElementById(`pw-msg-${username}`);
  const res = await fetch(`/api/users/${username}/password`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password: pw })
  });
  const data = await res.json();
  if (data.ok) { msg.className='msg ok'; msg.textContent='✓ עודכן'; }
  else          { msg.className='msg err'; msg.textContent = data.error || 'שגיאה'; }
}

loadUsers();
</script>
</body>
</html>
